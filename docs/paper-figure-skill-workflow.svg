<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="960" viewBox="0 0 1800 960" role="img" aria-labelledby="title desc">
  <title id="title">Paper Figure Skill workflow</title>
  <desc id="desc">A bilingual flowchart showing canonical master creation, two-pass fine-grained inventory, transparent asset regeneration, editable PowerPoint recomposition, visual QA, local repair, and final delivery.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1728"/>
      <stop offset="1" stop-color="#101b2e"/>
    </linearGradient>
    <linearGradient id="masterAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="inventoryAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="assetAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="rebuildAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="deliveryAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <pattern id="checker" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#e2e8f0"/>
      <rect width="9" height="9" fill="#ffffff"/>
      <rect x="9" y="9" width="9" height="9" fill="#ffffff"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000814" flood-opacity="0.34"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#8ea3bd"/>
    </marker>
    <marker id="repairArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#fbbf24"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .eyebrow { font-size: 17px; font-weight: 700; letter-spacing: 2.4px; fill: #89a0bc; }
      .title { font-size: 43px; font-weight: 760; fill: #f8fafc; letter-spacing: -0.8px; }
      .subtitle { font-size: 20px; font-weight: 450; fill: #9fb0c7; }
      .step { font-size: 15px; font-weight: 800; letter-spacing: 1.8px; }
      .cardTitle { font-size: 25px; font-weight: 760; fill: #f8fafc; }
      .cardZh { font-size: 18px; font-weight: 600; fill: #b9c6d8; }
      .body { font-size: 17px; font-weight: 520; fill: #cbd5e1; }
      .small { font-size: 14px; font-weight: 620; fill: #aebed1; }
      .mini { font-size: 12px; font-weight: 700; fill: #c7d3e2; letter-spacing: 0.2px; }
      .pill { fill: #132239; stroke: #2c405b; stroke-width: 1.2; }
      .card { fill: #0f1c30; stroke: #263a55; stroke-width: 1.5; }
      .inner { fill: #12233a; stroke: #2b405c; stroke-width: 1.2; }
      .connector { fill: none; stroke: #8ea3bd; stroke-width: 3; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="960" rx="34" fill="url(#background)"/>
  <circle cx="1510" cy="52" r="150" fill="#2563eb" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="1190" cy="888" r="170" fill="#7c3aed" opacity="0.08" filter="url(#softGlow)"/>

  <!-- Workflow connectors -->
  <path d="M82 155 C430 116, 650 172, 940 140 S1450 115, 1715 150" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.22"/>
  <path d="M82 164 C430 203, 650 136, 940 170 S1450 198, 1715 157" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.2"/>
  <path d="M82 173 C430 145, 650 202, 940 158 S1450 136, 1715 168" fill="none" stroke="#34d399" stroke-width="2" opacity="0.18"/>

  <text x="80" y="58" class="eyebrow">Paper Figure Skill</text>
  <text x="80" y="108" class="title">Master → fine-grained assets → editable figure</text>
  <text x="80" y="140" class="subtitle">母图 → 细粒度透明素材 → 原位拼回可编辑框架图</text>

  <g transform="translate(1445 58)">
    <rect width="275" height="48" rx="24" fill="#10233a" stroke="#31506e"/>
    <circle cx="27" cy="24" r="7" fill="#4ade80"/>
    <text x="46" y="30" class="small" fill="#d7e4f2">One resumable Codex run</text>
  </g>

  <!-- Main cards -->
  <g filter="url(#shadow)">
    <rect x="80" y="200" width="365" height="430" rx="28" class="card"/>
    <rect x="80" y="200" width="365" height="7" rx="4" fill="url(#masterAccent)"/>

    <rect x="500" y="200" width="365" height="430" rx="28" class="card"/>
    <rect x="500" y="200" width="365" height="7" rx="4" fill="url(#inventoryAccent)"/>

    <rect x="920" y="200" width="365" height="430" rx="28" class="card"/>
    <rect x="920" y="200" width="365" height="7" rx="4" fill="url(#assetAccent)"/>

    <rect x="1340" y="200" width="380" height="430" rx="28" class="card"/>
    <rect x="1340" y="200" width="380" height="7" rx="4" fill="url(#rebuildAccent)"/>
  </g>

  <!-- Arrows between phases -->
  <path d="M454 415 H486" class="connector"/>
  <path d="M874 415 H906" class="connector"/>
  <path d="M1294 415 H1326" class="connector"/>

  <!-- Card 1 -->
  <text x="110" y="241" class="step" fill="#38bdf8">01  CANONICAL MASTER</text>
  <text x="110" y="279" class="cardTitle">Create or accept the master</text>
  <text x="110" y="307" class="cardZh">生成或接收完整母图</text>

  <g transform="translate(110 336)">
    <rect width="86" height="36" rx="18" class="pill"/>
    <text x="43" y="23" text-anchor="middle" class="mini">PAPER</text>
    <rect x="96" width="86" height="36" rx="18" class="pill"/>
    <text x="139" y="23" text-anchor="middle" class="mini">PROMPT</text>
    <rect x="192" width="132" height="36" rx="18" class="pill"/>
    <text x="258" y="23" text-anchor="middle" class="mini">STYLE REFS</text>
  </g>

  <path d="M272 381 V404" class="connector"/>
  <g transform="translate(112 416)">
    <rect width="310" height="154" rx="18" fill="#eaf4ff"/>
    <rect x="19" y="20" width="82" height="106" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/>
    <rect x="113" y="34" width="84" height="78" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/>
    <rect x="210" y="20" width="81" height="106" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
    <path d="M101 73 H113 M197 73 H210" stroke="#64748b" stroke-width="4"/>
    <circle cx="60" cy="73" r="20" fill="#60a5fa" opacity="0.45"/>
    <path d="M137 55 H174 M137 73 H174 M137 91 H174" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/>
    <path d="M231 52 L271 93 M271 52 L231 93" stroke="#22c55e" stroke-width="7" stroke-linecap="round"/>
    <rect x="105" y="133" width="100" height="10" rx="5" fill="#0f172a" opacity="0.18"/>
  </g>
  <g transform="translate(123 583)">
    <circle cx="7" cy="7" r="7" fill="#38bdf8"/>
    <text x="24" y="13" class="small">3 candidates → 1 canonical master</text>
  </g>

  <!-- Card 2 -->
  <text x="530" y="241" class="step" fill="#a78bfa">02  TWO-PASS INVENTORY</text>
  <text x="530" y="279" class="cardTitle">Explain every visual element</text>
  <text x="530" y="307" class="cardZh">两遍盘点，不留未解释元素</text>

  <g transform="translate(530 338)">
    <rect width="305" height="91" rx="18" class="inner"/>
    <circle cx="43" cy="45" r="25" fill="#2e2451" stroke="#a78bfa" stroke-width="2"/>
    <path d="M30 45 Q43 31 56 45 Q43 59 30 45 Z" fill="none" stroke="#c4b5fd" stroke-width="3"/>
    <circle cx="43" cy="45" r="5" fill="#c4b5fd"/>
    <text x="82" y="39" class="body">Semantic pass</text>
    <text x="82" y="65" class="small">modules • text • connectors • UI</text>
  </g>

  <g transform="translate(530 445)">
    <rect width="305" height="91" rx="18" class="inner"/>
    <circle cx="43" cy="45" r="25" fill="#2e2451" stroke="#a78bfa" stroke-width="2"/>
    <path d="M31 32 L55 56 M55 32 L31 56" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>
    <circle cx="57" cy="30" r="5" fill="#fbbf24"/>
    <circle cx="29" cy="59" r="4" fill="#fb7185"/>
    <text x="82" y="39" class="body">Residual pass</text>
    <text x="82" y="65" class="small">small icons • badges • occlusion</text>
  </g>

  <g transform="translate(530 554)">
    <rect width="305" height="47" rx="14" fill="#211b3b" stroke="#7c3aed"/>
    <circle cx="24" cy="23" r="10" fill="#a78bfa"/>
    <path d="M19 23 L23 27 L30 18" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="45" y="29" class="small" fill="#e9ddff">unexplained_visuals = 0</text>
  </g>

  <!-- Card 3 -->
  <text x="950" y="241" class="step" fill="#fb7185">03  TRANSPARENT ASSETS</text>
  <text x="950" y="279" class="cardTitle">Regenerate each distinct part</text>
  <text x="950" y="307" class="cardZh">每种视觉元素单独生成透明图</text>

  <g transform="translate(950 338)">
    <rect width="139" height="112" rx="16" fill="url(#checker)"/>
    <rect x="40" y="24" width="59" height="64" rx="18" fill="#f97316"/>
    <circle cx="69.5" cy="46" r="13" fill="#fff7ed"/>
    <path d="M53 75 Q70 60 87 75" fill="none" stroke="#fff7ed" stroke-width="7" stroke-linecap="round"/>
    <rect x="166" width="139" height="112" rx="16" fill="url(#checker)"/>
    <rect x="186" y="24" width="99" height="64" rx="11" fill="#1d4ed8"/>
    <rect x="199" y="38" width="54" height="8" rx="4" fill="#bfdbfe"/>
    <rect x="199" y="56" width="72" height="8" rx="4" fill="#93c5fd"/>
    <circle cx="270" cy="41" r="7" fill="#fbbf24"/>
  </g>
  <g transform="translate(950 466)">
    <rect width="139" height="112" rx="16" fill="url(#checker)"/>
    <path d="M33 79 Q69 23 105 79 Z" fill="#a78bfa"/>
    <circle cx="69" cy="47" r="17" fill="#f5f3ff"/>
    <rect x="166" width="139" height="112" rx="16" fill="url(#checker)"/>
    <path d="M205 76 C213 37 258 28 278 58 C258 84 226 91 205 76 Z" fill="#14b8a6"/>
    <circle cx="259" cy="53" r="6" fill="#ccfbf1"/>
  </g>
  <text x="950" y="605" class="small">1 distinct design = 1 generated asset</text>

  <!-- Card 4 -->
  <text x="1370" y="241" class="step" fill="#34d399">04  EDITABLE REBUILD</text>
  <text x="1370" y="279" class="cardTitle">Recompose at master positions</text>
  <text x="1370" y="307" class="cardZh">按母图比例、坐标和层级原位拼回</text>

  <g transform="translate(1370 338)">
    <rect width="320" height="207" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <rect x="18" y="25" width="84" height="145" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
    <rect x="118" y="47" width="84" height="102" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/>
    <rect x="218" y="25" width="84" height="145" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
    <path d="M102 98 H118 M202 98 H218" stroke="#64748b" stroke-width="4"/>
    <path d="M111 91 L118 98 L111 105 M211 91 L218 98 L211 105" fill="none" stroke="#64748b" stroke-width="3"/>
    <text x="60" y="55" text-anchor="middle" font-size="13" font-weight="800" fill="#1e3a8a">INPUT</text>
    <text x="160" y="75" text-anchor="middle" font-size="13" font-weight="800" fill="#4c1d95">MODEL</text>
    <text x="260" y="55" text-anchor="middle" font-size="13" font-weight="800" fill="#14532d">OUTPUT</text>
    <g transform="translate(137 91)">
      <rect width="46" height="37" rx="9" fill="#f97316"/>
      <circle cx="23" cy="18" r="9" fill="#fff7ed"/>
    </g>
    <rect x="120" y="183" width="80" height="8" rx="4" fill="#0f172a" opacity="0.18"/>
  </g>
  <g transform="translate(1370 565)">
    <rect width="100" height="36" rx="18" class="pill"/>
    <text x="50" y="23" text-anchor="middle" class="mini">NATIVE TEXT</text>
    <rect x="110" width="92" height="36" rx="18" class="pill"/>
    <text x="156" y="23" text-anchor="middle" class="mini">SHAPES</text>
    <rect x="212" width="108" height="36" rx="18" class="pill"/>
    <text x="266" y="23" text-anchor="middle" class="mini">CONNECTORS</text>
  </g>

  <!-- QA band -->
  <g filter="url(#shadow)">
    <rect x="80" y="686" width="835" height="204" rx="26" class="card"/>
    <rect x="940" y="686" width="390" height="204" rx="26" fill="#211d16" stroke="#59471d" stroke-width="1.5"/>
    <rect x="1355" y="686" width="365" height="204" rx="26" fill="#10271e" stroke="#20603d" stroke-width="1.5"/>
  </g>

  <text x="112" y="728" class="step" fill="#60a5fa">05  RENDER &amp; VISUAL QA  /  渲染与视觉验收</text>
  <text x="112" y="764" class="cardTitle">Compare the rebuilt slide with the canonical master</text>
  <g transform="translate(112 790)">
    <rect width="124" height="38" rx="19" class="pill"/><text x="62" y="24" text-anchor="middle" class="mini">SIDE-BY-SIDE</text>
    <rect x="134" width="98" height="38" rx="19" class="pill"/><text x="183" y="24" text-anchor="middle" class="mini">OVERLAY</text>
    <rect x="242" width="78" height="38" rx="19" class="pill"/><text x="281" y="24" text-anchor="middle" class="mini">DIFF</text>
    <rect x="330" width="94" height="38" rx="19" class="pill"/><text x="377" y="24" text-anchor="middle" class="mini">BBOXES</text>
    <rect x="434" width="156" height="38" rx="19" class="pill"/><text x="512" y="24" text-anchor="middle" class="mini">ASSET CONTACT SHEET</text>
  </g>
  <g transform="translate(112 848)">
    <circle cx="7" cy="7" r="7" fill="#4ade80"/>
    <text x="24" y="13" class="small">exact text • complete graph • no missing assets • no full-slide flattening</text>
  </g>

  <!-- Repair loop -->
  <text x="972" y="728" class="step" fill="#fbbf24">IF A GATE FAILS  /  若未通过</text>
  <text x="972" y="765" class="cardTitle">Repair only the failing element</text>
  <text x="972" y="794" class="cardZh">只修失败局部，不无条件重做整图</text>
  <path d="M1005 839 C1055 874 1210 874 1262 835" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" marker-end="url(#repairArrow)"/>
  <text x="1134" y="860" text-anchor="middle" class="mini" fill="#fcd34d">REBUILD → RECHECK</text>
  <path d="M1264 686 C1290 655 1370 650 1452 652 C1510 653 1540 647 1540 630" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="7 7" opacity="0.8" marker-end="url(#repairArrow)"/>

  <!-- Delivery -->
  <text x="1387" y="728" class="step" fill="#4ade80">PASS  /  通过</text>
  <text x="1387" y="765" class="cardTitle">Final delivery</text>
  <text x="1387" y="794" class="cardZh">最终交付，用户只需验收</text>
  <g transform="translate(1387 820)">
    <rect width="300" height="46" rx="23" fill="url(#deliveryAccent)"/>
    <path d="M24 23 L31 30 L42 16" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="29" font-size="14" font-weight="800" fill="#ffffff">PPTX • SVG • PNG • ASSETS • QA</text>
  </g>

  <text x="80" y="925" class="small" fill="#71859f">Canonical visual source: master figure  •  Semantic source: user text and paper  •  Editable source of truth: framework.pptx</text>
</svg>
